name: Adolat Olympic Club checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: npm run typecheck && npm run build
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q --junitxml=test-results/ci.xml
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-test-report
          path: test-results/
  postgres-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_operator
          POSTGRES_DB: adolat_test
          POSTGRES_PASSWORD: isolated-ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_operator -d adolat_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test_operator:isolated-ci-test-password@localhost:5432/adolat_test
      TEST_DATABASE_CONFIRM: disposable
      DATA_DIR: /tmp/adolat-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt -r requirements-postgres.txt
      - run: python -m pytest -q --ignore=tests/test_browser.py --ignore=tests/test_v2_browser.py --junitxml=test-results/postgres.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-postgres-report
          path: test-results/
